version: 2

models:
  - name: bronze_date #  Must match the filename of a model -- including case sensitivity.
    config:
      materialized: view

  - name: bronze_returns #  Must match the filename of a model -- including case sensitivity.
    config:
      materialized: view

  - name: bronze_sales #  Must match the filename of a model -- including case sensitivity.
    columns:
      - name: sales_id
        data_tests:
          - unique
          - not_null
      - name: gross_amount
        data_tests:
          - generic_non_negative

  - name: bronze_store #  Must match the filename of a model -- including case sensitivity.
    columns:
      - name: store_sk
        data_tests:
          - unique
          - not_null
      - name: store_name
        data_tests:
          - accepted_values:
              values:  ['MegaMart Brooklyn', 'MegaMart Manhattan', 'MegaMart Austin', 'MegaMart San Jose', 'MegaMart Toronto']
      - name: country
        data_tests:
          - accepted_values:
              values: ['USA', 'Canada']
              severity: warn